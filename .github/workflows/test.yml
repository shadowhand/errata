name: Test

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get required PHP version
        id: php-version
        run: |
          version=$(jq -r '.require.php' composer.json | sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/')
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "::error::Could not determine PHP version from require.php in composer.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          coverage: pcov

      - name: Validate composer
        run: composer validate

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_PRIVATE_ACCESS || github.token }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check
        run: composer run check

      - name: Lint
        run: composer run lint

      - name: Analyze
        run: composer run analyze

      - name: Test
        run: composer run test
